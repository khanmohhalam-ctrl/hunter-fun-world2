name: Build HUNTER FUN WORLD APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip HUNTER_FUN_WORLD_Test_Project.zip -d project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        uses: android-actions/build-android-app@v3
        with:
          project-path: project
          sub-module: app
          build-type: debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HUNTER-FUN-WORLD-APK
          path: project/app/build/outputs/apk/debug/*.apk
